name: library

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: ${DB_PASSWORD:-library-demo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    image: ${APP_IMAGE:-viktorbarczi/pims_zadanie:1.0}
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/library
      DB_USERNAME: library
      DB_PASSWORD: ${DB_PASSWORD:-library-demo}
      JWT_SECRET: ${JWT_SECRET:-library-demo-signing-secret-at-least-32-bytes-long}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - target: 8081
        host_ip: 127.0.0.1

volumes:
  postgres-data:
