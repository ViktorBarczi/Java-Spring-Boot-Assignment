# Docker's DNS returns all replicas of the Compose service named "app".
# Re-resolve the service after scaling or recreating application containers.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream library_backend {
    zone library_backend 64k;
    server app:8081 resolve max_fails=1 fail_timeout=5s;
    keepalive 16;
}

log_format library '$remote_addr "$request" $status upstream=$upstream_addr';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log library;

    location / {
        proxy_pass http://library_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # Demonstrates which app instance handled a request in Postman.
        add_header X-Upstream-Addr $upstream_addr always;
    }
}
