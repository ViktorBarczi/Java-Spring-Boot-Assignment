# Used only by containers; normal IDE runs continue to use the in-memory H2 database.
server.port=8081
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/library}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:library}
spring.datasource.password=${DB_PASSWORD:library-demo}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# PostgreSQL initializes the schema before any application replica starts.
spring.jpa.hibernate.ddl-auto=validate
spring.cache.type=none
app.jwt.secret=${JWT_SECRET:library-demo-signing-secret-at-least-32-bytes-long}
